name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get gl4es latest commit hash
        id: gl4es-sha
        shell: bash
        run: |
          echo "sha=$(git ls-remote https://github.com/PojavLauncherTeam/gl4es-114-extra refs/heads/master | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Get JRE8
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          path: depends
          workflow_conclusion: success
          allow_forks: false
          repo: PojavLauncherTeam/android-openjdk-build-multiarch
          branch: buildjre8
          name: jre8-ios-aarch64

      - name: Get JRE17
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          path: depends
          workflow_conclusion: success
          allow_forks: false
          repo: PojavLauncherTeam/android-openjdk-build-multiarch
          branch: buildjre17-21
          name: jre17-ios-aarch64

      - name: Get JRE21
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          path: depends
          workflow_conclusion: completed
          allow_forks: false
          repo: PojavLauncherTeam/android-openjdk-build-multiarch
          branch: buildjre17-21
          name: jre21-ios-aarch64

      - name: Install build dependencies
        shell: bash
        run: |
          brew update
          brew install gnu-make

      - name: Build iOS IPA
        shell: bash
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          export RUNNER=1

          echo "Building iOS IPA..."

          gmake -j"$(sysctl -n hw.ncpu)" dsym package PLATFORM=2

          echo "IPA build completed."

      - name: Find IPA
        shell: bash
        run: |
          echo "Searching for generated IPA..."
          find artifacts -type f -name "*.ipa" -print

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NovaLauncher-iOS-IPA
          path: artifacts/*.ipa
          if-no-files-found: error

      - name: Upload dSYM
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NovaLauncher-dSYM
          path: artifacts/PojavLauncher.dSYM
          if-no-files-found: ignore
