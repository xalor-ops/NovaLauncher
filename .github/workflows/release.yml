name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          brew update
          brew install gnu-make

      - name: Show environment
        run: |
          sw_vers
          xcodebuild -version
          gmake --version

      - name: Prepare Java dependencies
        run: |
          echo "Preparing Java 8, Java 17 and Java 21..."
          gmake jre

      - name: Build iOS IPA
        env:
          RUNNER: 1
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

          echo "Building iOS IPA..."

          gmake -j"$(sysctl -n hw.ncpu)" \
            dsym \
            package \
            PLATFORM=2

      - name: Show build artifacts
        if: always()
        run: |
          echo "Artifacts:"
          find artifacts -maxdepth 3 -type f -print 2>/dev/null || true

          echo ""
          echo "IPA files:"
          find artifacts -type f -name "*.ipa" -print 2>/dev/null || true

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: NovaLauncher-iOS-IPA
          path: artifacts/*.ipa
          if-no-files-found: error

      - name: Upload dSYM
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NovaLauncher-iOS-dSYM
          path: artifacts/PojavLauncher.dSYM
          if-no-files-found: ignore
