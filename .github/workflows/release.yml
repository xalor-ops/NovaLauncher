name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        shell: bash
        run: |
          brew update
          brew install make wget

      - name: Download iOS JRE 8
        shell: bash
        run: |
          mkdir -p depends
          cd depends

          echo "Downloading JRE 8..."

          curl -L \
            "https://nightly.link/PojavLauncherTeam/android-openjdk-build-multiarch/workflows/build/buildjre8/jre8-ios-aarch64.zip" \
            -o jre8-ios-aarch64.zip

          unzip -o jre8-ios-aarch64.zip
          rm jre8-ios-aarch64.zip

      - name: Download iOS JRE 17
        shell: bash
        run: |
          cd depends

          echo "Downloading JRE 17..."

          curl -L \
            "https://nightly.link/PojavLauncherTeam/android-openjdk-build-multiarch/workflows/build/buildjre17-21/jre17-ios-aarch64.zip" \
            -o jre17-ios-aarch64.zip

          unzip -o jre17-ios-aarch64.zip
          rm jre17-ios-aarch64.zip

      - name: Download iOS JRE 21
        shell: bash
        run: |
          cd depends

          echo "Downloading JRE 21..."

          curl -L \
            "https://nightly.link/PojavLauncherTeam/android-openjdk-build-multiarch/workflows/build/buildjre17-21/jre21-ios-aarch64.zip" \
            -o jre21-ios-aarch64.zip

          unzip -o jre21-ios-aarch64.zip
          rm jre21-ios-aarch64.zip

      - name: Prepare JRE directories
        shell: bash
        run: |
          cd depends

          echo "Contents of depends:"
          find . -maxdepth 2 -type f | head -100

          mkdir -p java-8-openjdk
          mkdir -p java-17-openjdk
          mkdir -p java-21-openjdk

          for archive in jre8-*.tar.xz; do
            if [ -f "$archive" ]; then
              tar -xf "$archive" -C java-8-openjdk
              break
            fi
          done

          for archive in jre17-*.tar.xz; do
            if [ -f "$archive" ]; then
              tar -xf "$archive" -C java-17-openjdk
              break
            fi
          done

          for archive in jre21-*.tar.xz; do
            if [ -f "$archive" ]; then
              tar -xf "$archive" -C java-21-openjdk
              break
            fi
          done

      - name: Check JRE installation
        shell: bash
        run: |
          echo "JRE 8:"
          find depends/java-8-openjdk -maxdepth 2 -type f | head -20 || true

          echo "JRE 17:"
          find depends/java-17-openjdk -maxdepth 2 -type f | head -20 || true

          echo "JRE 21:"
          find depends/java-21-openjdk -maxdepth 2 -type f | head -20 || true

      - name: Build iOS IPA
        shell: bash
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          export RUNNER=1

          echo "Building PojavLauncher iOS IPA..."

          gmake -j"$(sysctl -n hw.ncpu)" \
            dsym \
            package \
            PLATFORM=2

      - name: Find generated IPA
        shell: bash
        run: |
          echo "Generated files:"
          find artifacts -type f -print

          echo ""
          echo "IPA files:"
          find artifacts -type f -name "*.ipa" -print

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: NovaLauncher-iOS-IPA
          path: artifacts/*.ipa
          if-no-files-found: error

      - name: Upload dSYM
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NovaLauncher-iOS-dSYM
          path: artifacts/PojavLauncher.dSYM
          if-no-files-found: ignore
